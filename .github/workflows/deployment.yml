name: Deployment Workflow
on: 
    push:
        branches:
            - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: ng build --prod

            - name: Deploy project
              run: echo "Deploying project..."
